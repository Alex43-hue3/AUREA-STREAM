    /**
     * ============================================================================
     * UTILIDADES GENERALES Y DETECCIÓN DE FUENTES DE VIDEO
     * ============================================================================
     */

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const colors = {
        success: 'bg-emerald-950/95 border-emerald-500/50 text-emerald-200',
        error: 'bg-rose-950/95 border-rose-500/50 text-rose-200',
        info: 'bg-obsidian-800/95 border-amber-500/40 text-zinc-100'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-2xl text-xs sm:text-sm font-medium backdrop-blur-md animate-fade-in ${colors[type] || colors.info}`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 3400);
    }

    function detectSourceType(url) {
      if (!url) return 'mp4';
      const lower = url.toLowerCase().trim();
      if (lower.includes('youtube.com') || lower.includes('youtu.be')) return 'youtube';
      if (lower.includes('facebook.com') || lower.includes('fb.watch')) return 'facebook';
      if (lower.includes('drive.google.com')) return 'drive';
      if (lower.includes('dropbox.com')) return 'dropbox';
      return 'mp4';
    }

    function getSourceBadge(sourceType) {
      const map = {
        youtube: { label: 'YouTube', cls: 'bg-red-500/20 text-red-300 border-red-500/30' },
        facebook: { label: 'Facebook', cls: 'bg-blue-500/20 text-blue-300 border-blue-500/30' },
        drive: { label: 'Google Drive', cls: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' },
        dropbox: { label: 'Dropbox', cls: 'bg-sky-500/20 text-sky-300 border-sky-500/30' },
        mp4: { label: 'MP4 Directo', cls: 'bg-amber-500/20 text-amber-300 border-amber-500/30' }
      };
      return map[sourceType] || map.mp4;
    }

    function resolvePlayableMedia(rawUrl, explicitType) {
      const url = (rawUrl || '').trim();
      const sourceType = explicitType || detectSourceType(url);

      if (sourceType === 'youtube') {
        let videoId = '';
        try {
          if (url.includes('youtu.be/')) {
            videoId = url.split('youtu.be/')[1].split(/[?&#]/)[0];
          } else if (url.includes('/embed/')) {
            videoId = url.split('/embed/')[1].split(/[?&#]/)[0];
          } else if (url.includes('/live/')) {
            videoId = url.split('/live/')[1].split(/[?&#]/)[0];
          } else {
            const parsed = new URL(url);
            videoId = parsed.searchParams.get('v') || '';
          }
        } catch (e) {
          const match = url.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
          if (match) videoId = match[1];
        }

        const embedUrl = videoId
          ? `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`
          : url;

        return { mode: 'iframe', src: embedUrl, sourceType: 'youtube' };
      }

      if (sourceType === 'facebook') {
        const embedUrl = url.includes('plugins/video.php')
          ? url
          : `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false&autoplay=true`;
        return { mode: 'iframe', src: embedUrl, sourceType: 'facebook' };
      }

      if (sourceType === 'drive') {
        let fileId = '';
        const fileMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (fileMatch) {
          fileId = fileMatch[1];
        } else {
          try {
            const parsed = new URL(url);
            fileId = parsed.searchParams.get('id') || '';
          } catch (e) {}
        }

        const embedUrl = fileId
          ? `https://drive.google.com/file/d/${fileId}/preview`
          : url.replace(/\/view.*$/, '/preview');

        return { mode: 'iframe', src: embedUrl, sourceType: 'drive' };
      }

      if (sourceType === 'dropbox') {
        let directUrl = url
          .replace('www.dropbox.com', 'dl.dropboxusercontent.com')
          .replace(/[?&]dl=0/, '')
          .replace(/[?&]dl=1/, '');
        directUrl += (directUrl.includes('?') ? '&' : '?') + 'raw=1';
        return { mode: 'video', src: directUrl, sourceType: 'dropbox' };
      }

      return { mode: 'video', src: url, sourceType: 'mp4' };
    }

    /**
     * ============================================================================
     * ALMACENAMIENTO LOCAL Y SINCRONIZACIÓN CON GITHUB (catalog.json)
     * ============================================================================
     */

    async function loadFromStorageAndCloud(forceCloud = false) {
      try {
        state.remoteCatalogUrl = localStorage.getItem(STORAGE_KEYS.REMOTE_CATALOG_URL) || '';

        const rawProfiles = localStorage.getItem(STORAGE_KEYS.PROFILES);
        if (rawProfiles) {
          state.profiles = JSON.parse(rawProfiles);
        } else {
          state.profiles = [
            {
              id: 'prof-default-1',
              name: 'Invitado VIP',
              avatarId: 'amber',
              myList: ['demo-movie-1', 'demo-series-1'],
              history: {}
            }
          ];
          saveProfiles();
        }

        const activeProf = localStorage.getItem(STORAGE_KEYS.ACTIVE_PROFILE);
        if (activeProf && state.profiles.some(p => p.id === activeProf)) {
          state.activeProfileId = activeProf;
        } else {
          state.activeProfileId = null;
        }

        const rawCatalog = localStorage.getItem(STORAGE_KEYS.CATALOG);
        if (rawCatalog) {
          state.catalog = JSON.parse(rawCatalog);
          state.catalogSource = 'local';
        } else {
          state.catalog = JSON.parse(JSON.stringify(INITIAL_DEMO_CATALOG));
          state.catalogSource = 'demo';
        }

        await syncCatalogFromGitHub(forceCloud);
      } catch (e) {
        console.error('Error cargando datos:', e);
        state.catalog = JSON.parse(JSON.stringify(INITIAL_DEMO_CATALOG));
        state.profiles = [];
      }
    }

    async function syncCatalogFromGitHub(notify = false) {
      const targetUrl = state.remoteCatalogUrl.trim() || './catalog.json';
      const isCustomRaw = Boolean(state.remoteCatalogUrl.trim());

      state.isSyncingCatalog = true;
      try {
        const separator = targetUrl.includes('?') ? '&' : '?';
        const fetchUrl = `${targetUrl}${separator}t=${Date.now()}`;

        const response = await fetch(fetchUrl, { cache: 'no-store' });
        if (response.ok) {
          const remoteData = await response.json();
          const items = Array.isArray(remoteData)
            ? remoteData
            : (Array.isArray(remoteData.catalog) ? remoteData.catalog : null);

          if (items && items.length > 0) {
            state.catalog = items;
            state.catalogSource = isCustomRaw ? 'github-raw' : 'github-repo';
            saveCatalog();
            if (notify) {
              showToast(`Catálogo sincronizado desde GitHub (${items.length} títulos)`, 'success');
            }
          } else if (notify) {
            showToast('El archivo catalog.json en GitHub está vacío o no tiene el formato esperado', 'error');
          }
        } else if (notify) {
          showToast('No se encontró catalog.json en GitHub aún. Usando caché local.', 'info');
        }
      } catch (err) {
        if (notify) {
          showToast('No se pudo conectar con GitHub. Se mantiene el catálogo local.', 'info');
        }
      } finally {
        state.isSyncingCatalog = false;
      }
    }

    function saveCatalog() {
      try {
        localStorage.setItem(STORAGE_KEYS.CATALOG, JSON.stringify(state.catalog));
      } catch (e) {
        showToast('Error al guardar el catálogo en el dispositivo', 'error');
      }
    }

    function saveProfiles() {
      try {
        localStorage.setItem(STORAGE_KEYS.PROFILES, JSON.stringify(state.profiles));
      } catch (e) {
        showToast('Error al guardar perfiles locales', 'error');
      }
    }

    function getActiveProfile() {
      return state.profiles.find(p => p.id === state.activeProfileId) || null;
    }

    /**
     * ============================================================================
     * DETECCIÓN DE RUTA ADMINISTRATIVA (#admin / ?admin / /admin)
     * ============================================================================
     */

    function checkAdminRoute() {
      const hash = window.location.hash.toLowerCase();
      const search = window.location.search.toLowerCase();
      const pathname = window.location.pathname.toLowerCase();

      state.isAdminRoute =
        hash.includes('admin') ||
        search.includes('admin') ||
        pathname.endsWith('/admin') ||
        pathname.endsWith('/admin/');
    }

    function toggleAdminRoute(enable) {
      if (enable) {
        window.location.hash = 'admin';
      } else {
        const cleanUrl = window.location.pathname + window.location.search.replace(/[?&]admin(=[^&]*)?/gi, '');
        window.history.replaceState(null, '', cleanUrl || '/');
        state.isAdminRoute = false;
        renderApp();
      }
    }

    window.addEventListener('hashchange', () => {
      checkAdminRoute();
      renderApp();
    });

    /**
     * ============================================================================
     * GESTIÓN DE PERFILES LOCALES
     * ============================================================================
     */

    function selectProfile(profileId) {
      state.activeProfileId = profileId;
      localStorage.setItem(STORAGE_KEYS.ACTIVE_PROFILE, profileId);
      state.currentTab = 'home';
      state.selectedCategory = 'Todas';
      renderApp();
    }

    function switchProfileScreen() {
      state.activeProfileId = null;
      localStorage.removeItem(STORAGE_KEYS.ACTIVE_PROFILE);
      renderApp();
    }

    function openProfileModal(mode, profileId = null) {
      if (mode === 'edit' && profileId) {
        const prof = state.profiles.find(p => p.id === profileId);
        if (!prof) return;
        state.profileModal = { mode: 'edit', id: prof.id, name: prof.name, avatarId: prof.avatarId };
      } else {
        state.profileModal = { mode: 'create', id: null, name: '', avatarId: 'amber' };
      }
      renderApp();
    }

    function closeProfileModal() {
      state.profileModal = null;
      renderApp();
    }

    function selectModalAvatar(avatarId) {
      if (!state.profileModal) return;
      state.profileModal.avatarId = avatarId;
      renderApp();
    }

    function handleSaveProfile(event) {
      event.preventDefault();
      const input = document.getElementById('profile-name-input');
      const name = (input ? input.value : '').trim();
      if (!name) {
        showToast('Escribe un nombre para el perfil', 'error');
        return;
      }

      if (state.profileModal.mode === 'create') {
        const newProf = {
          id: 'prof-' + Date.now(),
          name,
          avatarId: state.profileModal.avatarId || 'amber',
          myList: [],
          history: {}
        };
        state.profiles.push(newProf);
        saveProfiles();
        showToast(`Perfil "${name}" creado en este dispositivo`, 'success');
      } else {
        const idx = state.profiles.findIndex(p => p.id === state.profileModal.id);
        if (idx > -1) {
          state.profiles[idx].name = name;
          state.profiles[idx].avatarId = state.profileModal.avatarId;
          saveProfiles();
          showToast('Perfil actualizado', 'success');
        }
      }

      state.profileModal = null;
      renderApp();
    }

    function deleteProfile(profileId) {
      if (state.profiles.length <= 1) {
        showToast('Debe existir al menos un perfil en el dispositivo', 'error');
        return;
      }
      state.profiles = state.profiles.filter(p => p.id !== profileId);
      if (state.activeProfileId === profileId) {
        state.activeProfileId = null;
        localStorage.removeItem(STORAGE_KEYS.ACTIVE_PROFILE);
      }
      saveProfiles();
      state.profileModal = null;
      showToast('Perfil eliminado del dispositivo', 'info');
      renderApp();
    }

    function toggleMyList(itemId) {
      const profile = getActiveProfile();
      if (!profile) return;

      if (!Array.isArray(profile.myList)) profile.myList = [];
      const exists = profile.myList.includes(itemId);

      if (exists) {
        profile.myList = profile.myList.filter(id => id !== itemId);
        showToast('Quitado de Mi Lista', 'info');
      } else {
        profile.myList.unshift(itemId);
        showToast('Agregado a Mi Lista', 'success');
      }

      saveProfiles();
      renderApp();
    }

    function recordWatchHistory(itemId, episodeLabel = null) {
      const profile = getActiveProfile();
      if (!profile) return;
      if (!profile.history) profile.history = {};
      profile.history[itemId] = {
        updatedAt: Date.now(),
        episodeLabel
      };
      saveProfiles();
    }

    /**
     * ============================================================================
     * REPRODUCTOR Y DETALLES DE CONTENIDO
     * ============================================================================
     */

    function openDetailModal(itemId) {
      const item = state.catalog.find(i => i.id === itemId);
      if (!item) return;
      state.detailModalItem = item;
      state.selectedSeasonIndex = 0;
      renderApp();
    }

    function closeDetailModal() {
      state.detailModalItem = null;
      renderApp();
    }

    function selectSeasonTab(idx) {
      state.selectedSeasonIndex = idx;
      renderApp();
    }

    function playMedia(itemId, seasonIdx = 0, episodeIdx = 0) {
      const item = state.catalog.find(i => i.id === itemId);
      if (!item) return;

      let targetUrl = item.url;
      let targetSourceType = item.sourceType;
      let subtitle = item.category || '';
      let episodeLabel = null;

      if (item.type === 'series') {
        const seasons = item.seasons || [];
        const season = seasons[seasonIdx] || seasons[0];
        const episode = season && season.episodes ? (season.episodes[episodeIdx] || season.episodes[0]) : null;
        if (!episode || !episode.url) {
          showToast('Esta serie aún no tiene episodios con enlace válido', 'error');
          return;
        }
        targetUrl = episode.url;
        targetSourceType = episode.sourceType;
        episodeLabel = `T${season.seasonNumber} • E${episode.number}: ${episode.title}`;
        subtitle = episodeLabel;
      }

      if (!targetUrl) {
        showToast('Este título no tiene un enlace configurado', 'error');
        return;
      }

      const resolved = resolvePlayableMedia(targetUrl, targetSourceType);
      recordWatchHistory(item.id, episodeLabel);

      state.detailModalItem = null;
      state.playerState = {
        item,
        resolved,
        subtitle,
        seasonIdx,
        episodeIdx
      };
      renderApp();
    }

    function closePlayer() {
      state.playerState = null;
      renderApp();
    }

    /**
     * ============================================================================
     * RENDERIZADO DE VISTAS PÚBLICAS (SIN ACCESOS VISIBLES A ADMIN)
     * ============================================================================

    function renderEmptyState(title, subtitle) {
      return `
        <div class="bg-obsidian-900/70 border border-zinc-800/80 rounded-2xl p-10 text-center max-w-lg mx-auto my-8">
          <div class="w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center text-2xl mx-auto mb-4">
            🎬
          </div>
          <h3 class="text-lg font-bold text-white mb-1">${escapeHtml(title)}</h3>
          <p class="text-sm text-zinc-400">${escapeHtml(subtitle)}</p>
        </div>
      `;
    }

    function renderProfileGate() {
      const modal = state.profileModal;

      return `
        <div class="min-h-screen flex flex-col justify-between bg-gradient-to-b from-obsidian-950 via-obsidian-900 to-obsidian-950 px-4 py-8">
          <header class="max-w-6xl w-full mx-auto flex items-center justify-between">

              </div>
              <span class="text-xl font-extrabold tracking-wider text-white">AUREA<span class="text-amber-400">STREAM</span></span>
            </div>
            <div class="flex items-center gap-2 text-xs text-zinc-500">

                return `
                  <div class="group relative flex flex-col items-center">
                    <button
                      onclick="selectProfile('${prof.id}')"
                      class="w-28 h-28 sm:w-32 sm:h-32 rounded-3xl bg-gradient-to-br ${av.gradient} flex items-center justify-center text-4xl sm:text-5xl shadow-xl ring-2 ring-transparent group-hover:ring-amber-400 group-hover:scale-105 transition-all duration-200 cursor-pointer"
                    >
                      ${av.icon}
                    </button>
                    <button
                      onclick="openProfileModal('edit', '${prof.id}')"
                      title="Editar perfil"
                      class="absolute -top-2 -right-2 w-8 h-8 rounded-full bg-obsidian-800 border border-zinc-700 text-zinc-300 hover:text-amber-400 hover:border-amber-400 flex items-center justify-center text-xs shadow-lg transition"
                    >
                      ✎
                    </button>
                    <span class="mt-3 text-sm sm:text-base font-semibold text-zinc-200 group-hover:text-amber-400 transition">
                      ${escapeHtml(prof.name)}

                  </div>
                `;
              }).join('')}

              <div class="flex flex-col items-center">
                <button
                  onclick="openProfileModal('create')"
                  class="w-28 h-28 sm:w-32 sm:h-32 rounded-3xl bg-obsidian-900/90 border-2 border-dashed border-zinc-700 hover:border-amber-400 hover:bg-obsidian-800 flex items-center justify-center text-3xl text-zinc-400 hover:text-amber-400 transition-all duration-200 cursor-pointer"
                >

                <span class="mt-3 text-sm sm:text-base font-medium text-zinc-400">
                  Agregar Perfil
                </span>

          </div>

          <footer class="text-center text-xs text-zinc-600">
            AUREA STREAM • Disfruta películas, series y TV en vivo en cualquier dispositivo
          </footer>
        </div>

        ${modal ? renderProfileFormModal(modal) : ''}
      `;
    }

    function renderProfileFormModal(modal) {
      const isEdit = modal.mode === 'edit';
      return `
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in">
          <div class="bg-obsidian-900 border border-zinc-800 rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl">
            <h2 class="text-xl font-extrabold text-white mb-1">
              ${isEdit ? 'Editar Perfil Local' : 'Crear Nuevo Perfil'}
            </h2>
            <p class="text-xs text-zinc-400 mb-6">
              Este perfil se guarda únicamente en este dispositivo.
            </p>

            <form onsubmit="handleSaveProfile(event)" class="space-y-5">
              <div>
                <label class="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-2">
                  Nombre del Perfil
                </label>
                <input
                  type="text"
                  id="profile-name-input"
                  value="${escapeHtml(modal.name)}"
                  placeholder="Ej. Familia, Niños, Sala..."
                  maxlength="24"
                  required
                  class="w-full px-4 py-3 rounded-xl bg-obsidian-950 border border-zinc-800 focus:border-amber-500 focus:outline-none text-sm text-white"
                />
              </div>

              <div>
                <label class="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-2">
                  Elige un Avatar
                </label>
                <div class="grid grid-cols-6 gap-2.5">
                  ${AVATAR_OPTIONS.map(av => {
                    const selected = modal.avatarId === av.id;
                    return `
                      <button
                        type="button"
                        onclick="selectModalAvatar('${av.id}')"
                        class="aspect-square rounded-2xl bg-gradient-to-br ${av.gradient} flex items-center justify-center text-xl transition ${selected ? 'ring-2 ring-white scale-105' : 'opacity-65 hover:opacity-100'}"
                      >
                        ${av.icon}
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

              <div class="flex items-center justify-between gap-3 pt-3">
                ${isEdit ? `
                  <button
                    type="button"
                    onclick="deleteProfile('${modal.id}')"
                    class="px-4 py-2.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs font-bold transition"
                  >
                    Eliminar
                  </button>
                ` : '<div></div>'}

                <div class="flex items-center gap-2">
                  <button
                    type="button"
                    onclick="closeProfileModal()"
                    class="px-4 py-2.5 rounded-xl bg-obsidian-800 hover:bg-zinc-700 text-zinc-300 text-xs font-bold transition"
                  >
                    Cancelar
                  </button>
                  <button
                    type="submit"
                    class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-black text-xs font-extrabold transition"
                  >
                    Guardar
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function setTab(tab) {
      state.currentTab = tab;
      state.selectedCategory = 'Todas';
      renderApp();
    }

    function setCategoryFilter(cat) {
      state.selectedCategory = cat;
      renderApp();
    }

    function renderNavbar(profile) {
      const av = AVATAR_OPTIONS.find(a => a.id === profile.avatarId) || AVATAR_OPTIONS[0];
      const navItems = [
        { id: 'home', label: 'Inicio' },
        { id: 'movies', label: 'Películas' },
        { id: 'series', label: 'Series' },
        { id: 'live', label: 'TV en Vivo' },
        { id: 'mylist', label: 'Mi Lista' }
      ];

      return `
        <header class="sticky top-0 z-40 bg-obsidian-950/90 backdrop-blur-xl border-b border-zinc-800/70">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-6">
              <button onclick="setTab('home')" class="flex items-center gap-2.5 cursor-pointer">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center text-black font-black text-base shadow-lg shadow-amber-500/20">
                  A
                </div>
                <span class="text-lg font-extrabold tracking-wider text-white hidden sm:inline">AUREA<span class="text-amber-400">STREAM</span></span>
              </button>

              <nav class="hidden md:flex items-center gap-1">
                ${navItems.map(item => {
                  const active = state.currentTab === item.id;
                  return `
                    <button
                      onclick="setTab('${item.id}')"
                      class="px-3.5 py-2 rounded-xl text-sm font-semibold transition ${active ? 'bg-amber-500/15 text-amber-400' : 'text-zinc-400 hover:text-white hover:bg-obsidian-800'}"
                    >
                      ${item.label}
                    </button>
                  `;
                }).join('')}
              </nav>
            </div>

            <div class="flex items-center gap-3">
              <div class="relative w-36 sm:w-56">
                <input
                  type="text"
                  id="global-search-input"
                  value="${escapeHtml(state.searchQuery)}"
                  placeholder="Buscar título o género..."
                  class="w-full pl-8 pr-3 py-1.5 rounded-xl bg-obsidian-900 border border-zinc-800 focus:border-amber-500 focus:outline-none text-xs sm:text-sm text-white placeholder-zinc-500"
                />
                <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-zinc-500 text-xs">🔍</span>
              </div>

              <button
                onclick="switchProfileScreen()"
                title="Cambiar de perfil"
                class="flex items-center gap-2 pl-1.5 pr-3 py-1 rounded-full bg-obsidian-900 hover:bg-obsidian-800 border border-zinc-800 transition cursor-pointer"
              >
                <span class="w-7 h-7 rounded-full bg-gradient-to-br ${av.gradient} flex items-center justify-center text-sm">
                  ${av.icon}
                </span>
                <span class="text-xs font-semibold text-zinc-200 hidden sm:inline">${escapeHtml(profile.name)}</span>
              </button>
            </div>
          </div>

          <!-- Navegación móvil inferior -->
          <div class="md:hidden flex items-center justify-around border-t border-zinc-800/60 px-2 py-1.5 bg-obsidian-950">
            ${navItems.map(item => {
              const active = state.currentTab === item.id;
              return `
                <button
                  onclick="setTab('${item.id}')"
                  class="px-2.5 py-1 rounded-lg text-[11px] font-semibold transition ${active ? 'bg-amber-500/15 text-amber-400' : 'text-zinc-400'}"
                >
                  ${item.label}
                </button>
              `;
            }).join('')}
          </div>
        </header>
      `;
    }

    function renderMediaCard(item, profile) {
      const inList = (profile.myList || []).includes(item.id);
      const isLive = item.type === 'live';
      const fallbackPoster = `https://placehold.co/500x750/131319/fbbf24?text=${encodeURIComponent(item.title)}`;

      return `
        <div class="group relative bg-obsidian-900 border border-zinc-800/80 hover:border-amber-500/50 rounded-2xl overflow-hidden shadow-lg transition-all duration-300 hover:-translate-y-1 flex flex-col">
          <div
            onclick="openDetailModal('${item.id}')"
            class="relative aspect-[2/3] w-full overflow-hidden bg-obsidian-850 cursor-pointer"
          >
            <img
              src="${escapeHtml(item.poster || fallbackPoster)}"
              onerror="this.onerror=null;this.src='${fallbackPoster}';"
              alt="${escapeHtml(item.title)}"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-obsidian-950 via-transparent to-black/30 opacity-90"></div>

            <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5">
              ${isLive ? `
                <span class="px-2 py-0.5 rounded-md bg-rose-600 text-white text-[10px] font-extrabold tracking-wider flex items-center gap-1 shadow">
                  <span class="w-1.5 h-1.5 rounded-full bg-white live-dot"></span> EN VIVO
                </span>
              ` : `
                <span class="px-2 py-0.5 rounded-md bg-black/70 backdrop-blur-md text-zinc-200 text-[10px] font-bold border border-white/10">
                  ${item.type === 'series' ? 'SERIE' : 'PELÍCULA'}
                </span>
              `}
            </div>

            <button
              onclick="event.stopPropagation(); toggleMyList('${item.id}')"
              title="${inList ? 'Quitar de Mi Lista' : 'Agregar a Mi Lista'}"
              class="absolute top-2.5 right-2.5 w-8 h-8 rounded-full bg-black/70 hover:bg-amber-500 text-white hover:text-black backdrop-blur-md border border-white/10 flex items-center justify-center text-xs font-bold transition"
            >
              ${inList ? '✓' : '+'}
            </button>

            <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
              <button
                onclick="event.stopPropagation(); playMedia('${item.id}')"
                class="w-12 h-12 rounded-full bg-amber-500 text-black flex items-center justify-center text-lg font-black shadow-2xl shadow-amber-500/40 scale-90 group-hover:scale-100 transition"
              >
                ▶
              </button>
            </div>
          </div>

          <div class="p-3.5 flex-1 flex flex-col justify-between">
            <div>
              <h3
                onclick="openDetailModal('${item.id}')"
                class="font-bold text-sm text-white group-hover:text-amber-400 transition line-clamp-1 cursor-pointer"
              >
                ${escapeHtml(item.title)}
              </h3>
              <div class="flex items-center gap-2 text-[11px] text-zinc-400 mt-1">
                <span>${escapeHtml(item.category || 'General')}</span>
                <span>•</span>
                <span>${escapeHtml(item.year || '2025')}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderCarouselSection(title, items, profile, targetTab = null) {
      return `
        <section class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg sm:text-xl font-extrabold text-white tracking-tight">${escapeHtml(title)}</h2>
            ${targetTab ? `
              <button
                onclick="setTab('${targetTab}')"
                class="text-xs font-bold text-amber-400 hover:text-amber-300 transition cursor-pointer"
              >
                Ver todo →
              </button>
            ` : ''}
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
            ${items.slice(0, 10).map(item => renderMediaCard(item, profile)).join('')}
          </div>
        </section>
      `;
    }

    function renderMainContent(profile) {
      const q = state.searchQuery.trim().toLowerCase();

      if (q) {
        const results = state.catalog.filter(item =>
          item.title.toLowerCase().includes(q) ||
          (item.category || '').toLowerCase().includes(q) ||
          (item.description || '').toLowerCase().includes(q)
        );
        return `
          <div class="max-w-7xl w-full mx-auto px-4 sm:px-6 py-8 animate-fade-in">
            <h2 class="text-xl font-extrabold text-white mb-6">
              Resultados para "${escapeHtml(state.searchQuery)}" (${results.length})
            </h2>
            ${results.length > 0
              ? `<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
                  ${results.map(item => renderMediaCard(item, profile)).join('')}
                 </div>`
              : renderEmptyState('Sin coincidencias', 'Intenta buscar con otro título o categoría.')
            }
          </div>
        `;
      }

      if (state.currentTab !== 'home') {
        let items = [];
        let pageTitle = '';

        if (state.currentTab === 'movies') {
          pageTitle = 'Películas';
          items = state.catalog.filter(i => i.type === 'movie');
        } else if (state.currentTab === 'series') {
          pageTitle = 'Series';
          items = state.catalog.filter(i => i.type === 'series');
        } else if (state.currentTab === 'live') {
          pageTitle = 'TV en Vivo';
          items = state.catalog.filter(i => i.type === 'live');
        } else if (state.currentTab === 'mylist') {
          pageTitle = 'Mi Lista Personal';
          const listIds = profile.myList || [];
          items = state.catalog.filter(i => listIds.includes(i.id));
        }

        const categories = ['Todas', ...new Set(items.map(i => i.category).filter(Boolean))];
        if (state.selectedCategory !== 'Todas') {
          items = items.filter(i => i.category === state.selectedCategory);
        }

        return `
          <div class="max-w-7xl w-full mx-auto px-4 sm:px-6 py-8 space-y-6 animate-fade-in">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <h1 class="text-2xl sm:text-3xl font-extrabold text-white">${pageTitle}</h1>

              ${categories.length > 2 ? `
                <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
                  ${categories.map(cat => {
                    const active = state.selectedCategory === cat;
                    return `
                      <button
                        onclick="setCategoryFilter('${escapeHtml(cat)}')"
                        class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${active ? 'bg-amber-500 text-black' : 'bg-obsidian-900 text-zinc-400 hover:text-white border border-zinc-800'}"
                      >
                        ${escapeHtml(cat)}
                      </button>
                    `;
                  }).join('')}
                </div>
              ` : ''}
            </div>

            ${items.length > 0
              ? `<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
                  ${items.map(item => renderMediaCard(item, profile)).join('')}
                 </div>`
              : renderEmptyState(
                  state.currentTab === 'mylist' ? 'Tu lista está vacía' : 'Aún no hay contenido aquí',
                  state.currentTab === 'mylist'
                    ? 'Haz clic en el botón "+" en cualquier título para guardarlo aquí.'
                    : 'Pronto se agregará nuevo contenido a esta sección.'
                )
            }
          </div>
        `;
      }

      const heroItem = state.catalog.find(i => i.featured) || state.catalog[0];
      const liveItems = state.catalog.filter(i => i.type === 'live');
      const movieItems = state.catalog.filter(i => i.type === 'movie');
      const seriesItems = state.catalog.filter(i => i.type === 'series');
      const historyIds = Object.keys(profile.history || {}).sort(
        (a, b) => (profile.history[b].updatedAt || 0) - (profile.history[a].updatedAt || 0)
      );
      const continueItems = historyIds
        .map(id => state.catalog.find(i => i.id === id))
        .filter(Boolean);

      return `
        <div class="animate-fade-in">
          ${heroItem ? `
            <section class="relative w-full min-h-[420px] sm:min-h-[500px] flex items-end overflow-hidden border-b border-zinc-800/70">
              <img
                src="${escapeHtml(heroItem.backdrop || heroItem.poster)}"
                onerror="this.style.display='none'"
                alt="${escapeHtml(heroItem.title)}"
                class="absolute inset-0 w-full h-full object-cover opacity-45"
              />
              <div class="absolute inset-0 bg-gradient-to-t from-obsidian-950 via-obsidian-950/60 to-transparent"></div>
              <div class="absolute inset-0 bg-gradient-to-r from-obsidian-950 via-obsidian-950/75 to-transparent"></div>

              <div class="relative z-10 max-w-7xl w-full mx-auto px-4 sm:px-6 py-10 sm:py-14">
                <div class="max-w-2xl space-y-4">
                  <div class="flex items-center gap-2">
                    <span class="px-2.5 py-1 rounded-md bg-amber-500 text-black text-[11px] font-extrabold uppercase tracking-wider">
                      Destacado
                    </span>
                    <span class="text-xs font-semibold text-zinc-300">
                      ${escapeHtml(heroItem.category || 'Estreno')} • ${escapeHtml(heroItem.year || '2025')}
                    </span>
                  </div>
                  <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight leading-tight">
                    ${escapeHtml(heroItem.title)}
                  </h1>
                  <p class="text-sm sm:text-base text-zinc-300 line-clamp-3">
                    ${escapeHtml(heroItem.description || '')}
                  </p>
                  <div class="flex flex-wrap items-center gap-3 pt-2">
                    <button
                      onclick="playMedia('${heroItem.id}')"
                      class="px-6 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-sm shadow-xl shadow-amber-500/25 transition flex items-center gap-2 cursor-pointer"
                    >
                      <span>▶</span> Reproducir Ahora
                    </button>
                    <button
                      onclick="openDetailModal('${heroItem.id}')"
                      class="px-5 py-3 rounded-xl bg-white/10 hover:bg-white/20 text-white backdrop-blur-md border border-white/15 font-bold text-sm transition cursor-pointer"
                    >
                      Más Información
                    </button>
                  </div>
                </div>
              </div>
            </section>
          ` : ''}

          <div class="max-w-7xl w-full mx-auto px-4 sm:px-6 py-10 space-y-12">
            ${continueItems.length > 0 ? renderCarouselSection(`Continuar viendo para ${profile.name}`, continueItems, profile) : ''}
            ${liveItems.length > 0 ? renderCarouselSection('Canales de TV en Vivo', liveItems, profile, 'live') : ''}
            ${movieItems.length > 0 ? renderCarouselSection('Películas Recomendadas', movieItems, profile, 'movies') : ''}
            ${seriesItems.length > 0 ? renderCarouselSection('Series y Documentales', seriesItems, profile, 'series') : ''}

            ${state.catalog.length === 0 ? renderEmptyState('Catálogo en preparación', 'Aún no hay títulos disponibles en este momento.') : ''}
          </div>
        </div>
      `;
    }

    function renderDetailModal(profile) {
      const item = state.detailModalItem;
      if (!item) return '';

      const inList = (profile.myList || []).includes(item.id);
      const seasons = item.seasons || [];
      const activeSeason = seasons[state.selectedSeasonIndex] || seasons[0];

      return `
        <div
          onclick="closeDetailModal()"
          class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto animate-fade-in"
        >
          <div
            onclick="event.stopPropagation()"
            class="bg-obsidian-900 border border-zinc-800 rounded-3xl max-w-3xl w-full overflow-hidden shadow-2xl my-auto"
          >
            <div class="relative h-56 sm:h-72 bg-obsidian-850">
              <img
                src="${escapeHtml(item.backdrop || item.poster)}"
                onerror="this.style.display='none'"
                alt="${escapeHtml(item.title)}"
                class="w-full h-full object-cover opacity-55"
              />
              <div class="absolute inset-0 bg-gradient-to-t from-obsidian-900 via-obsidian-900/40 to-transparent"></div>
              <button
                onclick="closeDetailModal()"
                class="absolute top-4 right-4 w-9 h-9 rounded-full bg-black/70 hover:bg-amber-500 text-white hover:text-black flex items-center justify-center font-bold transition"
              >
                ✕
              </button>
              <div class="absolute bottom-4 left-6 right-6">
                <span class="px-2.5 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[11px] font-bold uppercase">
                  ${item.type === 'series' ? 'Serie' : item.type === 'live' ? 'TV en Vivo' : 'Película'}
                </span>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-white mt-1">${escapeHtml(item.title)}</h2>
              </div>
            </div>

            <div class="p-6 space-y-6">
              <div class="flex flex-wrap items-center gap-3 text-xs text-zinc-400">
                <span class="font-semibold text-zinc-200">${escapeHtml(item.category || 'General')}</span>
                <span>•</span>
                <span>${escapeHtml(item.year || '2025')}</span>
                <span>•</span>
                <span>${escapeHtml(item.duration || 'HD')}</span>
                <span>•</span>
                <span class="px-2 py-0.5 rounded bg-obsidian-800 border border-zinc-700 text-zinc-300">${escapeHtml(item.rating || 'ATP')}</span>
              </div>

              <p class="text-sm text-zinc-300 leading-relaxed">
                ${escapeHtml(item.description || 'Sin descripción disponible.')}
              </p>

              <div class="flex flex-wrap items-center gap-3">
                <button
                  onclick="playMedia('${item.id}')"
                  class="px-6 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-sm transition flex items-center gap-2"
                >

    function attachMainViewEvents() {
      const searchInput = document.getElementById('global-search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          state.searchQuery = e.target.value;
          renderApp();
          const newInput = document.getElementById('global-search-input');
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(newInput.value.length, newInput.value.length);
          }
        });
      }
    }

    /**
     * ============================================================================
     * PANEL ADMINISTRATIVO (ACCESO EXCLUSIVO VÍA URL: #admin / ?admin / /admin)
     * ============================================================================
     */

    function initAdminSeasonsDraft(seasons) {
      if (Array.isArray(seasons) && seasons.length > 0) {
        state.adminSeasonsDraft = JSON.parse(JSON.stringify(seasons));
      } else {
        state.adminSeasonsDraft = [
          {
            seasonNumber: 1,
            episodes: [
              { number: 1, title: 'Episodio 1', duration: '45 min', url: '', sourceType: 'mp4' }
            ]
          }
        ];
      }
    }

    function setAdminFormType(type) {
      state.adminFormType = type;
      if (type === 'series' && state.adminSeasonsDraft.length === 0) {
        initAdminSeasonsDraft([]);
      }
      renderApp();
    }

    function addDraftSeason() {
      const nextNum = state.adminSeasonsDraft.length + 1;
      state.adminSeasonsDraft.push({
        seasonNumber: nextNum,
        episodes: [{ number: 1, title: 'Episodio 1', duration: '45 min', url: '', sourceType: 'mp4' }]
      });
      renderApp();
    }

    function removeDraftSeason(sIdx) {
      if (state.adminSeasonsDraft.length <= 1) return;
      state.adminSeasonsDraft.splice(sIdx, 1);
      state.adminSeasonsDraft.forEach((s, idx) => (s.seasonNumber = idx + 1));
      renderApp();
    }

    function addDraftEpisode(sIdx) {
      const season = state.adminSeasonsDraft[sIdx];
      if (!season) return;
      const nextNum = season.episodes.length + 1;
      season.episodes.push({
        number: nextNum,
        title: `Episodio ${nextNum}`,
        duration: '45 min',
        url: '',
        sourceType: 'mp4'
      });
      renderApp();
    }

    function removeDraftEpisode(sIdx, eIdx) {
      const season = state.adminSeasonsDraft[sIdx];
      if (!season || season.episodes.length <= 1) return;
      season.episodes.splice(eIdx, 1);
      season.episodes.forEach((ep, idx) => (ep.number = idx + 1));
      renderApp();
    }

    function updateDraftEpisodeField(sIdx, eIdx, field, value) {
      const ep = state.adminSeasonsDraft[sIdx]?.episodes?.[eIdx];
      if (!ep) return;
      ep[field] = value;
      if (field === 'url') {
        ep.sourceType = detectSourceType(value);
      }
    }

    function editCatalogItem(itemId) {
      const item = state.catalog.find(i => i.id === itemId);
      if (!item) return;
      state.adminEditingItem = JSON.parse(JSON.stringify(item));
      state.adminFormType = item.type;
      if (item.type === 'series') {
        initAdminSeasonsDraft(item.seasons);
      }
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetAdminForm() {
      state.adminEditingItem = null;
      state.adminFormType = 'movie';
      initAdminSeasonsDraft([]);
      renderApp();
    }

    function deleteCatalogItem(itemId) {
      state.catalog = state.catalog.filter(i => i.id !== itemId);
      state.catalogSource = 'local';
      saveCatalog();
      if (state.adminEditingItem && state.adminEditingItem.id === itemId) {
        resetAdminForm();
      } else {
        renderApp();
      }
      showToast('Elemento eliminado (descarga catalog.json para actualizar GitHub)', 'info');
    }

        return matchesType && matchesQuery;

          <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 py-8 space-y-8 flex-1">

                                  onchange="updateDraftEpisodeField(${sIdx}, ${eIdx}, 'url', this.value)"
                                  placeholder="Enlace YouTube, Facebook, Drive, Dropbox o MP4"
                                  class="w-full px-2.5 py-1.5 rounded-lg bg-obsidian-950 border border-zinc-800 text-xs text-white"
                                />
                              </div>
                            `).join('')}
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  `}

                  <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Sinopsis / Descripción</label>
                    <textarea
                      id="adm-description"
                      rows="2"
                      placeholder="Breve descripción del contenido..."
                      class="w-full px-3.5 py-2 rounded-xl bg-obsidian-950 border border-zinc-800 focus:border-amber-500 focus:outline-none text-sm text-white"
                    >${escapeHtml(editing ? editing.description : '')}</textarea>
                  </div>

                  <label class="flex items-center gap-2.5 cursor-pointer select-none">
                    <input
                      type="checkbox"
                      id="adm-featured"
                      ${editing && editing.featured ? 'checked' : ''}
                      class="w-4 h-4 rounded accent-amber-500"
                    />
                    <span class="text-xs font-semibold text-zinc-300">Mostrar como Destacado en portada</span>
                  </label>

                  <button
                    type="submit"
                    class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-sm shadow-lg shadow-amber-500/20 transition cursor-pointer"
                  >
                    ${editing ? 'Guardar Cambios' : 'Agregar al Catálogo'}
                  </button>
                </form>
              </section>

              <!-- LISTA DEL CATÁLOGO ACTUAL -->
              <section class="lg:col-span-7 bg-obsidian-900 border border-zinc-800 rounded-3xl p-6 space-y-5">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <h2 class="text-lg font-extrabold text-white">Catálogo Actual (${filteredList.length})</h2>
                  <div class="flex items-center gap-2">
                    <input
                      type="text"
                      id="admin-search-input"
                      value="${escapeHtml(state.adminSearch)}"
                      placeholder="Filtrar títulos..."
                      class="px-3 py-1.5 rounded-xl bg-obsidian-950 border border-zinc-800 text-xs text-white focus:border-amber-500 focus:outline-none"
                    />
                    <select
                      id="admin-type-filter"
                      class="px-3 py-1.5 rounded-xl bg-obsidian-950 border border-zinc-800 text-xs text-white focus:border-amber-500 focus:outline-none"
                    >
                      <option value="all" ${state.adminFilterType === 'all' ? 'selected' : ''}>Todos</option>
                      <option value="movie" ${state.adminFilterType === 'movie' ? 'selected' : ''}>Películas</option>
                      <option value="series" ${state.adminFilterType === 'series' ? 'selected' : ''}>Series</option>
                      <option value="live" ${state.adminFilterType === 'live' ? 'selected' : ''}>TV en Vivo</option>
                    </select>
                  </div>
                </div>

                <div class="space-y-3 max-h-[640px] overflow-y-auto pr-1">
                  ${filteredList.length === 0 ? `
                    <p class="text-sm text-zinc-500 text-center py-10">No hay elementos que coincidan con el filtro.</p>
                  ` : filteredList.map(item => {
                    const st = item.type === 'series'
                      ? 'series'
                      : (item.sourceType || detectSourceType(item.url));
                    const badge = item.type === 'series'
                      ? { label: `${(item.seasons || []).length} Temp.`, cls: 'bg-purple-500/20 text-purple-300 border-purple-500/30' }
                      : getSourceBadge(st);

                    return `
                      <div class="flex items-center justify-between gap-4 p-3.5 rounded-2xl bg-obsidian-950 border border-zinc-800/80 hover:border-zinc-700 transition">
                        <div class="flex items-center gap-3.5 min-w-0">
                          <img
                            src="${escapeHtml(item.poster || 'https://placehold.co/100x150/131319/fbbf24?text=TV')}"
                            onerror="this.src='https://placehold.co/100x150/131319/fbbf24?text=TV'"
                            alt=""
                            class="w-12 h-16 rounded-xl object-cover bg-obsidian-850 shrink-0"
                          />
                          <div class="min-w-0">
                            <div class="flex items-center gap-2 flex-wrap">
                              <h3 class="font-bold text-sm text-white truncate">${escapeHtml(item.title)}</h3>
                              <span class="px-2 py-0.5 rounded border text-[10px] font-bold ${badge.cls}">
                                ${badge.label}
                              </span>
                            </div>
                            <p class="text-xs text-zinc-400 mt-0.5">
                              ${item.type === 'movie' ? 'Película' : item.type === 'series' ? 'Serie' : 'TV en Vivo'} • ${escapeHtml(item.category || 'General')}
                            </p>
                          </div>
                        </div>

                        <div class="flex items-center gap-2 shrink-0">
                          <button
                            onclick="playMedia('${item.id}')"
                            title="Probar reproducción"
                            class="px-2.5 py-1.5 rounded-lg bg-emerald-500/15 hover:bg-emerald-500 text-emerald-300 hover:text-black text-xs font-bold transition"
                          >
                            ▶
                          </button>
                          <button
                            onclick="editCatalogItem('${item.id}')"
                            class="px-3 py-1.5 rounded-lg bg-obsidian-800 hover:bg-zinc-700 text-zinc-200 text-xs font-bold transition"
                          >
                            Editar
                          </button>
                          <button
                            onclick="deleteCatalogItem('${item.id}')"
                            class="px-2.5 py-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white text-xs font-bold transition"
                          >
                            ✕
                          </button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </section>
            </div>
          </main>
        </div>

        ${state.playerState ? renderPlayerOverlay() : ''}
      `;
    }

    function exportCatalogJson() {
      const dataStr = JSON.stringify(state.catalog, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'catalog.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Archivo catalog.json descargado. Súbelo a tu repo de GitHub.', 'success');
    }

    function copyCatalogJsonToClipboard() {
      const dataStr = JSON.stringify(state.catalog, null, 2);
      const textarea = document.createElement('textarea');
      textarea.value = dataStr;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('JSON copiado. Pégalo en catalog.json dentro de GitHub.', 'success');
      } catch (err) {
        showToast('No se pudo copiar automáticamente. Usa "Descargar catalog.json".', 'error');
      }
      textarea.remove();
    }

    function saveGithubRawUrl() {
      const input = document.getElementById('github-raw-url-input');
      if (!input) return;
      const url = input.value.trim();
      state.remoteCatalogUrl = url;
      if (url) {
        localStorage.setItem(STORAGE_KEYS.REMOTE_CATALOG_URL, url);
        showToast('URL Raw de GitHub guardada', 'success');
      } else {
        localStorage.removeItem(STORAGE_KEYS.REMOTE_CATALOG_URL);
        showToast('Usando ./catalog.json del mismo repositorio por defecto', 'info');
      }
      manualSyncFromGitHub();
    }

    async function manualSyncFromGitHub() {
      await syncCatalogFromGitHub(true);
      renderApp();
    }

    function attachAdminEvents() {
      const searchInput = document.getElementById('admin-search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          state.adminSearch = e.target.value;
          renderApp();
          const el = document.getElementById('admin-search-input');
          if (el) {
            el.focus();
            el.setSelectionRange(el.value.length, el.value.length);
          }
        });
      }

      const typeFilter = document.getElementById('admin-type-filter');
      if (typeFilter) {
        typeFilter.addEventListener('change', (e) => {
          state.adminFilterType = e.target.value;
          renderApp();
        });
      }

      const importInput = document.getElementById('import-json-input');
      if (importInput) {
        importInput.addEventListener('change', (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const parsed = JSON.parse(ev.target.result);
              const items = Array.isArray(parsed) ? parsed : parsed.catalog;
              if (!Array.isArray(items)) throw new Error('Formato inválido');
              state.catalog = items;
              state.catalogSource = 'local';
              saveCatalog();
              renderApp();
              showToast(`Catálogo importado (${items.length} títulos)`, 'success');
            } catch (err) {
              showToast('El archivo JSON no tiene un formato válido', 'error');
            }
          };
          reader.readAsText(file);
        });
      }

      const form = document.getElementById('admin-content-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const title = document.getElementById('adm-title').value.trim();
          const category = document.getElementById('adm-category').value.trim() || 'General';
          const year = document.getElementById('adm-year').value.trim() || '2025';
          const poster = document.getElementById('adm-poster').value.trim();
          const backdrop = document.getElementById('adm-backdrop').value.trim();
          const description = document.getElementById('adm-description').value.trim();
          const featured = document.getElementById('adm-featured').checked;

          if (!title) {
            showToast('El título es obligatorio', 'error');
            return;
          }

          if (featured) {
            state.catalog.forEach(item => (item.featured = false));
          }

          const newItemData = {
            id: state.adminEditingItem ? state.adminEditingItem.id : 'item-' + Date.now(),
            type: state.adminFormType,
            title,
            category,
            year,
            duration: state.adminFormType === 'live' ? '24/7' : state.adminFormType === 'series' ? `${state.adminSeasonsDraft.length} Temp.` : 'HD',
            rating: state.adminFormType === 'live' ? 'LIVE' : 'HD',
            featured,
            poster,
            backdrop,
            description
          };

          if (state.adminFormType === 'series') {
            newItemData.seasons = JSON.parse(JSON.stringify(state.adminSeasonsDraft));
          } else {
            const url = document.getElementById('adm-url').value.trim();
            if (!url) {
              showToast('El enlace del video es obligatorio', 'error');
              return;
            }
            newItemData.url = url;
            newItemData.sourceType = detectSourceType(url);
          }

          if (state.adminEditingItem) {
            const idx = state.catalog.findIndex(i => i.id === state.adminEditingItem.id);
            if (idx > -1) state.catalog[idx] = newItemData;
            showToast('Contenido actualizado (recuerda subir catalog.json a GitHub)', 'success');
          } else {
            state.catalog.unshift(newItemData);
            showToast('Agregado al borrador local (descarga catalog.json para GitHub)', 'success');
          }

          state.catalogSource = 'local';
          saveCatalog();
          resetAdminForm();
        });
      }
    }

    /**
     * ============================================================================
     * RENDERIZADO PRINCIPAL Y ARRANQUE DE LA APLICACIÓN
     * ============================================================================
     */

    function renderApp() {
      const app = document.getElementById('app');
      if (!app) return;

      if (state.isAdminRoute) {
        if (state.adminSeasonsDraft.length === 0) {
          initAdminSeasonsDraft([]);
        }
        app.innerHTML = renderAdminPanel();
        attachAdminEvents();
        return;
      }

      const activeProfile = getActiveProfile();
      if (!activeProfile) {
        app.innerHTML = renderProfileGate();
        return;
      }

      app.innerHTML = `
        ${renderNavbar(activeProfile)}
        <main class="flex-1">
          ${renderMainContent(activeProfile)}
        </main>
        ${renderFooter()}
        ${renderDetailModal(activeProfile)}
        ${renderPlayerOverlay()}
      `;
      attachMainViewEvents();
    }

    window.addEventListener('DOMContentLoaded', async () => {
      checkAdminRoute();
      await loadFromStorageAndCloud(false);
      renderApp();
    });
  </script>
</body>
</html>
