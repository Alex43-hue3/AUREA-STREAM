    // =========================================================================
    // 3. UTILIDADES GENERALES Y DETECCIÓN DE FUENTES DE VIDEO
    // =========================================================================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-950/95 border-emerald-500/60 text-emerald-100',
        error: 'bg-rose-950/95 border-rose-500/60 text-rose-100',
        info: 'bg-obsidian-900/95 border-amber-500/60 text-zinc-100'
      };
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-2xl text-xs sm:text-sm font-semibold backdrop-blur-md transition-all duration-300 ${colors[type] || colors.info}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function detectSourceType(url) {
      if (!url) return 'mp4';
      const lower = url.toLowerCase();
      if (lower.includes('youtube.com') || lower.includes('youtu.be')) return 'youtube';
      if (lower.includes('facebook.com') || lower.includes('fb.watch')) return 'facebook';
      if (lower.includes('drive.google.com')) return 'drive';
      if (lower.includes('dropbox.com')) return 'dropbox';
      if (lower.includes('.m3u8')) return 'm3u8';
      return 'mp4';
    }

    function getSourceBadge(sourceType) {
      const map = {
        youtube: { label: 'YouTube', cls: 'bg-red-600/20 text-red-400 border-red-500/30' },
        facebook: { label: 'Facebook', cls: 'bg-blue-600/20 text-blue-400 border-blue-500/30' },
        drive: { label: 'Google Drive', cls: 'bg-emerald-600/20 text-emerald-400 border-emerald-500/30' },
        dropbox: { label: 'Dropbox', cls: 'bg-sky-600/20 text-sky-400 border-sky-500/30' },
        m3u8: { label: 'HLS .M3U8', cls: 'bg-purple-600/20 text-purple-400 border-purple-500/30' },
        mp4: { label: 'Directo MP4', cls: 'bg-amber-500/20 text-amber-300 border-amber-500/30' }
      };
      return map[sourceType] || map.mp4;
    }

    function resolvePlayableMedia(rawUrl, explicitType) {
      const url = (rawUrl || '').trim();
      const type = explicitType && explicitType !== 'auto' ? explicitType : detectSourceType(url);

      if (type === 'youtube') {
        let videoId = '';
        const watchMatch = url.match(/[?&]v=([^&]+)/);
        const shortMatch = url.match(/youtu\.be\/([^?&]+)/);
        const embedMatch = url.match(/youtube\.com\/embed\/([^?&]+)/);
        const liveMatch = url.match(/youtube\.com\/live\/([^?&]+)/);
        videoId = (watchMatch && watchMatch[1]) || (shortMatch && shortMatch[1]) || (embedMatch && embedMatch[1]) || (liveMatch && liveMatch[1]) || '';
        if (videoId) {
          return {
            mode: 'iframe',
            provider: 'youtube',
            src: `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&playsinline=1`
          };
        }
      }

      if (type === 'facebook') {
        return {
          mode: 'iframe',
          provider: 'facebook',
          src: `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false&autoplay=true`
        };
      }

      if (type === 'drive') {
        const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          return {
            mode: 'iframe',
            provider: 'drive',
            src: `https://drive.google.com/file/d/${match[1]}/preview?autoplay=1&start=1`
          };
        }
      }

      if (type === 'dropbox') {
        let directUrl = url.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
        if (directUrl.includes('dl=0')) {
          directUrl = directUrl.replace('dl=0', 'raw=1');
        } else if (!directUrl.includes('raw=1')) {
          directUrl += (directUrl.includes('?') ? '&' : '?') + 'raw=1';
        }
        return {
          mode: 'video',
          provider: 'dropbox',
          isHls: directUrl.toLowerCase().includes('.m3u8'),
          src: directUrl
        };
      }

      return {
        mode: 'video',
        provider: type,
        isHls: type === 'm3u8' || url.toLowerCase().includes('.m3u8'),
        src: url
      };
    }

    function isEpisodicType(type) {
      return type === 'series' || type === 'anime';
    }

    function isItemUpcoming(item) {
      if (!item || !item.releaseAt) return false;
      const releaseTime = new Date(item.releaseAt).getTime();
      if (Number.isNaN(releaseTime)) return false;
      return releaseTime > Date.now();
    }

    function formatReleaseDateTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (Number.isNaN(d.getTime())) return isoStr;
      return d.toLocaleString('es-MX', {
        day: '2-digit',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function getCountdownLabel(isoStr) {
      if (!isoStr) return '';
      const diff = new Date(isoStr).getTime() - Date.now();
      if (diff <= 0) return 'Disponible ahora';
      const mins = Math.floor(diff / 60000);
      const hours = Math.floor(mins / 60);
      const days = Math.floor(hours / 24);
      if (days > 0) return `Estreno en ${days}d ${hours % 24}h`;
      if (hours > 0) return `Estreno en ${hours}h ${mins % 60}m`;
      return `Estreno en ${Math.max(1, mins)} min`;
    }

    // =========================================================================
    // 4. ALMACENAMIENTO LOCAL Y SINCRONIZACIÓN CON GITHUB
    // =========================================================================
    function saveProfilesToStorage() {
      localStorage.setItem(STORAGE_KEYS.PROFILES, JSON.stringify(state.profiles));
      if (state.activeProfileId) {
        localStorage.setItem(STORAGE_KEYS.ACTIVE_PROFILE, state.activeProfileId);
      } else {
        localStorage.removeItem(STORAGE_KEYS.ACTIVE_PROFILE);
      }
    }

    function saveCatalogLocally() {
      localStorage.setItem(STORAGE_KEYS.CATALOG, JSON.stringify(state.catalog));
    }

    async function syncCatalogToGithub(silent = false) {
      const { owner, repo, branch, token } = state.githubConfig;
      if (!owner || !repo || !token) return false;

      state.isSyncingGithub = true;
      if (!silent) renderApp();

      try {
        const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/catalog.json`;
        let existingSha = null;

        const getRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch || 'main')}`, {
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json'
          }
        });

        if (getRes.ok) {
          const fileData = await getRes.json();
          existingSha = fileData.sha;
        }

        const jsonContent = JSON.stringify(state.catalog, null, 2);
        const encodedBase64 = btoa(unescape(encodeURIComponent(jsonContent)));

        const putBody = {
          message: `Actualizar catalog.json desde AUREA STREAM (${new Date().toLocaleString()})`,
          content: encodedBase64,
          branch: branch || 'main'
        };
        if (existingSha) putBody.sha = existingSha;

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(putBody)
        });

        if (!putRes.ok) {
          const errJson = await putRes.json().catch(() => ({}));
          throw new Error(errJson.message || `Error HTTP ${putRes.status}`);
        }

        if (!silent) showToast('Catálogo sincronizado automáticamente en GitHub (catalog.json)', 'success');
        return true;
      } catch (err) {
        console.error('Error sincronizando con GitHub:', err);
        showToast(`Error al subir a GitHub: ${err.message}`, 'error');
        return false;
      } finally {
        state.isSyncingGithub = false;
        renderApp();
      }
    }

    async function persistCatalog(triggerGithub = true) {
      saveCatalogLocally();
      if (triggerGithub && state.githubConfig.token) {
        await syncCatalogToGithub(false);
      }
    }

    async function loadInitialData() {
      // Cargar configuración de GitHub
      try {
        const savedGh = JSON.parse(localStorage.getItem(STORAGE_KEYS.GH_CONFIG) || 'null');
        if (savedGh) {
          state.githubConfig = { ...state.githubConfig, ...savedGh };
        }
      } catch (e) {}

      // Cargar perfiles locales
      try {
        const savedProfiles = JSON.parse(localStorage.getItem(STORAGE_KEYS.PROFILES) || 'null');
        if (Array.isArray(savedProfiles) && savedProfiles.length > 0) {
          state.profiles = savedProfiles;
        } else {
          state.profiles = [
            { id: 'profile-1', name: 'Invitado VIP', avatar: 'gold', myList: [], history: [] }
          ];
          saveProfilesToStorage();
        }
      } catch (e) {
        state.profiles = [{ id: 'profile-1', name: 'Invitado VIP', avatar: 'gold', myList: [], history: [] }];
      }

      const savedActiveProfile = localStorage.getItem(STORAGE_KEYS.ACTIVE_PROFILE);
      if (savedActiveProfile && state.profiles.some(p => p.id === savedActiveProfile)) {
        state.activeProfileId = savedActiveProfile;
      }

      // Cargar catálogo local primero
      try {
        const localCat = JSON.parse(localStorage.getItem(STORAGE_KEYS.CATALOG) || 'null');
        state.catalog = Array.isArray(localCat) && localCat.length > 0 ? localCat : [...DEFAULT_CATALOG];
      } catch (e) {
        state.catalog = [...DEFAULT_CATALOG];
      }

      // Intentar traer catalog.json remoto (GitHub Pages / Repo)
      try {
        const remoteRes = await fetch(`./catalog.json?t=${Date.now()}`);
        if (remoteRes.ok) {
          const remoteData = await remoteRes.json();
          if (Array.isArray(remoteData) && remoteData.length > 0) {
            state.catalog = remoteData;
            saveCatalogLocally();
          }
        }
      } catch (e) {
        // Si no existe catalog.json remoto aún, se mantiene el catálogo local
      }
    }

    // =========================================================================
    // 5. GESTIÓN DE PERFILES, MI LISTA E HISTORIAL
    // =========================================================================
    function getActiveProfile() {
      return state.profiles.find(p => p.id === state.activeProfileId) || null;
    }

    function selectProfile(id) {
      state.activeProfileId = id;
      saveProfilesToStorage();
      renderApp();
    }

    function switchProfile() {
      state.activeProfileId = null;
      saveProfilesToStorage();
      renderApp();
    }

    function openProfileModal(profileId = null) {
      state.profileModalOpen = true;
      state.editingProfileId = profileId;
      if (profileId) {
        const p = state.profiles.find(item => item.id === profileId);
        state.selectedAvatarPreset = p ? p.avatar : 'gold';
      } else {
        state.selectedAvatarPreset = 'gold';
      }
      renderApp();
    }

    function closeProfileModal() {
      state.profileModalOpen = false;
      state.editingProfileId = null;
      renderApp();
    }

    function saveProfileForm(event) {
      event.preventDefault();
      const input = document.getElementById('profile-name-input');
      const name = (input ? input.value : '').trim();
      if (!name) {
        showToast('Escribe un nombre para el perfil', 'error');
        return;
      }

      if (state.editingProfileId) {
        const idx = state.profiles.findIndex(p => p.id === state.editingProfileId);
        if (idx !== -1) {
          state.profiles[idx].name = name;
          state.profiles[idx].avatar = state.selectedAvatarPreset;
        }
        showToast('Perfil actualizado', 'success');
      } else {
        const newProfile = {
          id: 'profile-' + Date.now(),
          name,
          avatar: state.selectedAvatarPreset,
          myList: [],
          history: []
        };
        state.profiles.push(newProfile);
        state.activeProfileId = newProfile.id;
        showToast(`Perfil "${name}" creado`, 'success');
      }

      state.profileModalOpen = false;
      state.editingProfileId = null;
      saveProfilesToStorage();
      renderApp();
    }

    function deleteProfile(profileId) {
      if (state.profiles.length <= 1) {
        showToast('Debe existir al menos un perfil en el dispositivo', 'error');
        return;
      }
      state.profiles = state.profiles.filter(p => p.id !== profileId);
      if (state.activeProfileId === profileId) {
        state.activeProfileId = null;
      }
      state.profileModalOpen = false;
      state.editingProfileId = null;
      saveProfilesToStorage();
      showToast('Perfil eliminado', 'info');
      renderApp();
    }

    function toggleMyList(itemId, event) {
      if (event) event.stopPropagation();
      const profile = getActiveProfile();
      if (!profile) return;
      if (!Array.isArray(profile.myList)) profile.myList = [];

      const exists = profile.myList.includes(itemId);
      if (exists) {
        profile.myList = profile.myList.filter(id => id !== itemId);
        showToast('Eliminado de Mi Lista', 'info');
      } else {
        profile.myList.unshift(itemId);
        showToast('Añadido a Mi Lista', 'success');
      }
      saveProfilesToStorage();
      renderApp();
    }

    function recordWatchHistory(itemId, episodeLabel = null) {
      const profile = getActiveProfile();
      if (!profile) return;
      if (!Array.isArray(profile.history)) profile.history = [];
      profile.history = profile.history.filter(entry => entry.id !== itemId);
      profile.history.unshift({
        id: itemId,
        episodeLabel,
        watchedAt: Date.now()
      });
      if (profile.history.length > 20) profile.history.length = 20;
      saveProfilesToStorage();
    }

    // =========================================================================
    // 6. RUTA ADMIN OCULTA Y SEGURIDAD POR CLAVE
    // =========================================================================
    function checkAdminRoute() {
      const hash = window.location.hash.toLowerCase();
      const search = window.location.search.toLowerCase();
      const path = window.location.pathname.toLowerCase();
      const isRoute = hash.includes('admin') || search.includes('admin') || path.endsWith('/admin');
      state.isAdminRoute = isRoute;
      if (isRoute && sessionStorage.getItem(STORAGE_KEYS.ADMIN_UNLOCKED) === '1') {
        state.adminUnlocked = true;
      }
    }

      event.preventDefault();

      const entered = input ? input.value : '';

        state.adminPassError = '';
        sessionStorage.setItem(STORAGE_KEYS.ADMIN_UNLOCKED, '1');
        showToast('Acceso concedido al panel administrativo', 'success');
        renderApp();
      } else {
        state.adminPassError = 'Clave incorrecta. Inténtalo de nuevo.';
        renderApp();
      }

      event.preventDefault();

      const nextPass = (input ? input.value : '').trim();
      if (nextPass.length < 4) {
        showToast('La nueva clave debe tener al menos 4 caracteres', 'error');
        return;
      }
      localStorage.setItem(STORAGE_KEYS.ADMIN_PASS, nextPass);

    function openDetailModal(itemId) {

    function playMedia(itemId, seasonIdx = 0, episodeIdx = 0) {
      const item = state.catalog.find(i => i.id === itemId);
      if (!item) return;

      if (!state.isAdminRoute && isItemUpcoming(item)) {
        showToast(`Disponible automáticamente el ${formatReleaseDateTime(item.releaseAt)}`, 'info');
        openDetailModal(item.id);
        return;
      }

      let targetUrl = item.url;
      let targetSourceType = item.sourceType;
      let subtitle = `${item.category || 'HD'} • ${item.year || ''}`;

      if (isEpisodicType(item.type)) {
        const seasons = item.seasons || [];
        const season = seasons[seasonIdx] || seasons[0];
        const episode = season && season.episodes ? (season.episodes[episodeIdx] || season.episodes[0]) : null;
        if (!episode || !episode.url) {
          showToast('Este título aún no tiene episodios con enlace configurado', 'error');
          return;
        }
        targetUrl = episode.url;
        targetSourceType = episode.sourceType || detectSourceType(episode.url);
        subtitle = `Temporada ${season.seasonNumber} • Episodio ${episode.number}: ${episode.title}`;
      }

      if (!targetUrl) {
        showToast('Este título no tiene un enlace de reproducción válido', 'error');
        return;
      }

      const resolved = resolvePlayableMedia(targetUrl, targetSourceType);
      recordWatchHistory(item.id, isEpisodicType(item.type) ? subtitle : null);

      state.detailModalItem = null;
      state.playerState = {
        item,
        subtitle,
        resolved,
        seasonIdx,
        episodeIdx
      };
      renderApp();
    }

    function closePlayer() {
      if (window._activeHlsInstance) {
        try {
          window._activeHlsInstance.destroy();
        } catch (e) {}
        window._activeHlsInstance = null;
      }
      state.playerState = null;
      renderApp();
    }

    function initMediaPlayerRuntime() {
      if (!state.playerState) return;
      const { resolved } = state.playerState;
      if (resolved.mode !== 'video') return;

      const videoEl = document.getElementById('aurea-html5-video');
      if (!videoEl) return;

      if (window._activeHlsInstance) {
        try {
          window._activeHlsInstance.destroy();
        } catch (e) {}
        window._activeHlsInstance = null;
      }

      const attemptAutoplay = () => {
        const p = videoEl.play();
        if (p !== undefined) {
          p.catch(() => {
            videoEl.muted = true;
            videoEl.play().then(() => {
              videoEl.muted = false;
            }).catch(() => {});
          });
        }
      };

      if (resolved.isHls && window.Hls && Hls.isSupported()) {
        const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(resolved.src);
        hls.attachMedia(videoEl);
        hls.on(Hls.Events.MANIFEST_PARSED, attemptAutoplay);
        window._activeHlsInstance = hls;
      } else {
        videoEl.src = resolved.src;
        attemptAutoplay();
      }
    }

        const featured = getFeaturedItems();
        if (featured.length > 1 && state.activeTab === 'home' && !state.searchQuery.trim()) {

          return found && !isItemUpcoming(found) ? { _historyItem: found, episodeLabel: h.episodeLabel } : null;
        })
        .filter(Boolean);

      const upcomingItems = state.catalog.filter(isItemUpcoming);
      const availableItems = state.catalog.filter(i => !isItemUpcoming(i));
      const liveChannels = availableItems.filter(i => i.type === 'live');
      const movies = availableItems.filter(i => i.type === 'movie');
      const series = availableItems.filter(i => i.type === 'series');

          ${renderNetflixCarouselRow('row-movies', 'Películas Destacadas', movies, 'movies')}

    function renderCatalogView() {

      let items = [...state.catalog];

          (i.title || '').toLowerCase().includes(query) ||
          (i.category || '').toLowerCase().includes(query) ||
          (i.description || '').toLowerCase().includes(query)
        );
      } else {
        if (state.activeTab === 'movies') items = items.filter(i => i.type === 'movie' && !isItemUpcoming(i));
        if (state.activeTab === 'series') items = items.filter(i => i.type === 'series' && !isItemUpcoming(i));
        if (state.activeTab === 'anime') items = items.filter(i => i.type === 'anime' && !isItemUpcoming(i));
        if (state.activeTab === 'live') items = items.filter(i => i.type === 'live' && !isItemUpcoming(i));
        if (state.activeTab === 'upcoming') items = items.filter(isItemUpcoming);
        if (state.activeTab === 'mylist') {

          items = items.filter(i => listIds.includes(i.id));

    function startNewAdminItem(type = 'movie') {
      state.adminEditingItem = null;
      state.adminFormType = type;
      state.adminSeasonsDraft = isEpisodicType(type)
        ? [{ seasonNumber: 1, episodes: [{ number: 1, title: 'Episodio 1', url: '', sourceType: 'auto' }] }]
        : [];
      renderApp();
    }

    function editAdminItem(id) {
      const item = state.catalog.find(i => i.id === id);
      if (!item) return;
      state.adminEditingItem = item;
      state.adminFormType = item.type;
      state.adminSeasonsDraft = isEpisodicType(item.type)
        ? JSON.parse(JSON.stringify(item.seasons || [{ seasonNumber: 1, episodes: [{ number: 1, title: 'Episodio 1', url: '', sourceType: 'auto' }] }]))
        : [];
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setAdminFormType(type) {
      state.adminFormType = type;
      if (isEpisodicType(type) && state.adminSeasonsDraft.length === 0) {
        state.adminSeasonsDraft = [{ seasonNumber: 1, episodes: [{ number: 1, title: 'Episodio 1', url: '', sourceType: 'auto' }] }];
      }
      renderApp();
    }

    function addAdminSeason() {
      const nextNum = state.adminSeasonsDraft.length + 1;
      state.adminSeasonsDraft.push({
        seasonNumber: nextNum,
        episodes: [{ number: 1, title: 'Episodio 1', url: '', sourceType: 'auto' }]
      });
      renderApp();
    }

    function removeAdminSeason(sIdx) {
      state.adminSeasonsDraft.splice(sIdx, 1);
      renderApp();
    }

    function addAdminEpisode(sIdx) {
      const season = state.adminSeasonsDraft[sIdx];
      if (!season) return;
      const nextEp = season.episodes.length + 1;
      season.episodes.push({ number: nextEp, title: `Episodio ${nextEp}`, url: '', sourceType: 'auto' });
      renderApp();
    }

    function removeAdminEpisode(sIdx, eIdx) {
      const season = state.adminSeasonsDraft[sIdx];
      if (!season) return;
      season.episodes.splice(eIdx, 1);
      renderApp();
    }

    function updateDraftEpisode(sIdx, eIdx, field, value) {
      const ep = state.adminSeasonsDraft[sIdx] && state.adminSeasonsDraft[sIdx].episodes[eIdx];
      if (!ep) return;
      ep[field] = value;
      if (field === 'url' && (!ep.sourceType || ep.sourceType === 'auto')) {
        ep.sourceType = detectSourceType(value);
      }
    }

    async function handleSaveAdminItem(event) {
      event.preventDefault();
      const title = document.getElementById('adm-title').value.trim();
      const category = document.getElementById('adm-category').value.trim() || 'General';
      const year = document.getElementById('adm-year').value.trim() || new Date().getFullYear().toString();
      const poster = document.getElementById('adm-poster').value.trim();
      const backdrop = document.getElementById('adm-backdrop').value.trim();
      const description = document.getElementById('adm-desc').value.trim();
      const featured = document.getElementById('adm-featured').checked;
      const releaseAt = document.getElementById('adm-release').value;
      const type = state.adminFormType;

      if (!title) {
        showToast('El título es obligatorio', 'error');
        return;
      }

      const newItem = {
        id: state.adminEditingItem ? state.adminEditingItem.id : 'item-' + Date.now(),
        type,
        title,
        category,
        year,
        poster,
        backdrop,
        description,
        featured,
        releaseAt: releaseAt || ''
      };

      if (isEpisodicType(type)) {
        newItem.seasons = state.adminSeasonsDraft.map((s, sIdx) => ({
          seasonNumber: Number(s.seasonNumber) || sIdx + 1,
          episodes: (s.episodes || []).map((ep, eIdx) => ({
            number: Number(ep.number) || eIdx + 1,
            title: (ep.title || '').trim() || `Episodio ${eIdx + 1}`,
            url: (ep.url || '').trim(),
            sourceType: ep.sourceType && ep.sourceType !== 'auto' ? ep.sourceType : detectSourceType(ep.url)
          }))
        }));
      } else {
        const rawUrl = document.getElementById('adm-url').value.trim();
        const explicitSource = document.getElementById('adm-source').value;
        if (!rawUrl) {
          showToast('Debes ingresar el enlace del video o canal', 'error');
          return;
        }
        newItem.url = rawUrl;
        newItem.sourceType = explicitSource === 'auto' ? detectSourceType(rawUrl) : explicitSource;
      }

      if (state.adminEditingItem) {
        const idx = state.catalog.findIndex(i => i.id === state.adminEditingItem.id);
        if (idx !== -1) state.catalog[idx] = newItem;
        showToast('Contenido actualizado', 'success');
      } else {
        state.catalog.unshift(newItem);
        showToast('Contenido agregado al catálogo', 'success');
      }

      state.adminEditingItem = null;
      await persistCatalog(true);
      renderApp();
    }

    async function deleteAdminItem(id) {
      state.catalog = state.catalog.filter(i => i.id !== id);
      if (state.adminEditingItem && state.adminEditingItem.id === id) {
        state.adminEditingItem = null;
      }
      showToast('Elemento eliminado del catálogo', 'info');
      await persistCatalog(true);
      renderApp();
    }

    async function handleSaveGithubConfig(event) {
      event.preventDefault();
      state.githubConfig = {
        owner: document.getElementById('gh-owner').value.trim(),
        repo: document.getElementById('gh-repo').value.trim(),
        branch: document.getElementById('gh-branch').value.trim() || 'main',
        token: document.getElementById('gh-token').value.trim()
      };
      localStorage.setItem(STORAGE_KEYS.GH_CONFIG, JSON.stringify(state.githubConfig));
      showToast('Configuración de GitHub guardada', 'success');
      if (state.githubConfig.token) {
        await syncCatalogToGithub(false);
      } else {
        renderApp();
      }
    }

    function downloadCatalogJson() {
      const blob = new Blob([JSON.stringify(state.catalog, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'catalog.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function renderAdminPanel() {
      if (!state.adminUnlocked) {
        return `
          <div class="min-h-screen bg-obsidian-950 flex items-center justify-center p-4">
            <form onsubmit="handleUnlockAdmin(event)" class="bg-obsidian-900 border border-zinc-800 rounded-3xl max-w-md w-full p-7 shadow-2xl text-center">
              <div class="w-14 h-14 rounded-2xl bg-amber-500/15 border border-amber-500/40 text-amber-400 flex items-center justify-center text-2xl mx-auto mb-4">
                🔒
              </div>
              <h1 class="text-2xl font-black text-white mb-1">Acceso Restringido</h1>
              <p class="text-xs text-zinc-400 mb-6">Ingresa la clave de administrador para gestionar el catálogo.</p>

              <input
                id="admin-password-input"
                type="password"
                required
                autofocus
                placeholder="Contraseña de administrador"
                class="w-full px-4 py-3 rounded-xl bg-obsidian-950 border border-zinc-700 text-white text-sm text-center focus:outline-none focus:border-amber-400 mb-3"
              />

              ${state.adminPassError ? `
                <p class="text-xs font-bold text-rose-400 mb-3">${escapeHtml(state.adminPassError)}</p>
              ` : ''}

              <div class="flex items-center gap-2.5 mt-4">
                <button
                  type="button"
                  onclick="exitAdminMode()"
                  class="flex-1 py-3 rounded-xl bg-obsidian-850 hover:bg-obsidian-800 text-zinc-300 text-xs font-bold transition cursor-pointer"
                >
                  Volver a la App
                </button>
                <button
                  type="submit"
                  class="flex-1 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black text-xs font-extrabold transition cursor-pointer"
                >
                  Entrar
                </button>
              </div>
            </form>
          </div>
        `;
      }

      const editing = state.adminEditingItem;
      const isEpisodic = isEpisodicType(state.adminFormType);
      const filteredCatalog = state.catalog.filter(item => {
        const matchesType = state.adminFilterType === 'all' || item.type === state.adminFilterType;
        const q = state.adminSearch.trim().toLowerCase();
        const matchesSearch = !q || (item.title || '').toLowerCase().includes(q) || (item.category || '').toLowerCase().includes(q);
        return matchesType && matchesSearch;
      });

      return `
        <div class="min-h-screen bg-obsidian-950 text-zinc-100 pb-16">
          <header class="sticky top-0 z-30 bg-obsidian-950/95 backdrop-blur-md border-b border-zinc-800 px-4 sm:px-8 py-4">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-amber-500 text-black font-black flex items-center justify-center">⚙</div>
                <div>
                  <h1 class="text-base sm:text-lg font-black text-white">Panel Administrativo • AUREA STREAM</h1>
                  <p class="text-[11px] text-zinc-400">Gestión de Películas, Series, Anime y TV en Vivo (.m3u8)</p>
                </div>
              </div>

              <div class="flex items-center gap-2.5">
                <button
                  onclick="downloadCatalogJson()"
                  class="px-3.5 py-2 rounded-xl bg-obsidian-900 hover:bg-obsidian-800 border border-zinc-700 text-xs font-bold text-zinc-200 transition cursor-pointer"
                >
                  ⬇ Descargar JSON
                </button>
                <button
                  onclick="exitAdminMode()"
                  class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-black text-xs font-extrabold transition cursor-pointer"
                >
                  Salir del modo Admin
                </button>
              </div>
            </div>
          </header>

          <main class="max-w-7xl mx-auto px-4 sm:px-8 pt-6 space-y-6">
            <!-- Sincronización Automática con GitHub + Seguridad -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
              <form onsubmit="handleSaveGithubConfig(event)" class="lg:col-span-2 bg-emerald-950/20 border border-emerald-500/30 rounded-3xl p-5">
                <div class="flex items-center justify-between gap-2 mb-3">
                  <div>
                    <h2 class="text-sm font-black text-emerald-300">Auto-Guardado en GitHub (catalog.json)</h2>
                    <p class="text-[11px] text-zinc-400">Cada cambio actualiza automáticamente tu repositorio para que se vea en todos tus dispositivos.</p>
                  </div>
                  <span class="px-2.5 py-1 rounded-full text-[10px] font-black ${state.githubConfig.token ? 'bg-emerald-500/20 text-emerald-300' : 'bg-zinc-800 text-zinc-400'}">
                    ${state.isSyncingGithub ? 'Sincronizando...' : (state.githubConfig.token ? '● Conectado' : '○ Sin Token')}
                  </span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-4 gap-2.5">
                  <input id="gh-owner" type="text" value="${escapeHtml(state.githubConfig.owner)}" placeholder="Usuario GitHub" class="px-3 py-2 rounded-xl bg-obsidian-950 border border-zinc-700 text-xs text-white" />
                  <input id="gh-repo" type="text" value="${escapeHtml(state.githubConfig.repo)}" placeholder="Repositorio" class="px-3 py-2 rounded-xl bg-obsidian-950 border border-zinc-700 text-xs text-white" />
                  <input id="gh-branch" type="text" value="${escapeHtml(state.githubConfig.branch)}" placeholder="Rama (main)" class="px-3 py-2 rounded-xl bg-obsidian-950 border border-zinc-700 text-xs text-white" />
                  <input id="gh-token" type="password" value="${escapeHtml(state.githubConfig.token)}" placeholder="GitHub Token (ghp_...)" class="px-3 py-2 rounded-xl bg-obsidian-950 border border-zinc-700 text-xs text-white" />
                </div>

                <div class="mt-3 flex justify-end">
                  <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black text-xs font-extrabold transition cursor-pointer">
                    Conectar y Sincronizar GitHub
                  </button>
                </div>
              </form>

              <form onsubmit="handleChangeAdminPassword(event)" class="bg-obsidian-900 border border-zinc-800 rounded-3xl p-5 flex flex-col justify-between">
                <div>
                  <h2 class="text-sm font-black text-amber-400 mb-1">Clave de Acceso Admin</h2>
                  <p class="text-[11px] text-zinc-400 mb-3">Cambia la contraseña requerida al entrar a #admin (inicial: <code class="text-zinc-200">admin1234</code>).</p>
                  <input id="new-admin-pass-input" type="password" placeholder="Nueva contraseña (mín. 4 caracteres)" class="w-full px-3 py-2 rounded-xl bg-obsidian-950 border border-zinc-700 text-xs text-white" />
                </div>
                <div class="mt-3 flex justify-end">
                  <button type="submit" class="px-4 py-2 rounded-xl bg-obsidian-800 hover:bg-amber-500 text-zinc-200 hover:text-black text-xs font-bold transition cursor-pointer">
                    Actualizar Clave
                  </button>
                </div>
              </form>
            </div>

            <!-- Formulario de Creación / Edición -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <form onsubmit="handleSaveAdminItem(event)" class="lg:col-span-5 bg-obsidian-900 border border-zinc-800 rounded-3xl p-6 space-y-4 h-fit">
                <div class="flex items-center justify-between">
                  <h2 class="text-lg font-black text-white">
                    ${editing ? 'Editar Contenido' : 'Agregar Nuevo Contenido'}
                  </h2>
                  ${editing ? `
                    <button type="button" onclick="startNewAdminItem('movie')" class="text-xs font-bold text-amber-400 hover:underline cursor-pointer">
                      + Nuevo
                    </button>
                  ` : ''}
                </div>

                <!-- Selector de Tipo -->
                <div class="grid grid-cols-4 gap-1.5 bg-obsidian-950 p-1.5 rounded-2xl border border-zinc-800">
                  ${[
                    { id: 'movie', label: '🎬 Película' },
                    { id: 'series', label: '📺 Serie' },
                    { id: 'anime', label: '⛩️ Anime' },
                    { id: 'live', label: '📡 TV Vivo' }
                  ].map(t => `
                    <button
                      type="button"
                      onclick="setAdminFormType('${t.id}')"
                      class="py-2 rounded-xl text-[11px] font-extrabold transition cursor-pointer ${state.adminFormType === t.id ? 'bg-amber-500 text-black' : 'text-zinc-400 hover:text-white'}"
                    >
                      ${t.label}
                    </button>
                  `).join('')}
                </div>

                <div>
                  <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Título *</label>
                  <input id="adm-title" type="text" required value="${editing ? escapeHtml(editing.title) : ''}" placeholder="Nombre de la película, serie, anime o canal" class="w-full px-3.5 py-2.5 rounded-xl bg-obsidian-950 border border-zinc-700 text-xs text-white" />
                </div>

                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Categoría / Género</label>
                    <input id="adm-category" type="text" value="${editing ? escapeHtml(editing.category) : ''}" placeholder="Acción, Deportes, Shonen..." class="w-full px-3.5 py-2.5 rounded-xl bg-obsidian-950 border border-zinc-700 text-xs text-white" />
                  </div>
                  <div>
                    <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Año / Etiqueta</label>
                    <input id="adm-year" type="text" value="${editing ? escapeHtml(editing.year) : '2025'}" placeholder="2025 o EN VIVO" class="w-full px-3.5 py-2.5 rounded-xl bg-obsidian-950 border border-zinc-700 text-xs text-white" />
                  </div>
                </div>

                <div>
                  <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">URL Póster Vertical</label>
                  <input id="adm-poster" type="url" value="${editing ? escapeHtml(editing.poster) : ''}" placeholder="https://..." class="w-full px-3.5 py-2.5 rounded-xl bg-obsidian-950 border border-zinc-700 text-xs text-white" />
                </div>

                <div>
                  <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">URL Fondo Panorámico (Banner)</label>
                  <input id="adm-backdrop" type="url" value="${editing ? escapeHtml(editing.backdrop) : ''}" placeholder="https://..." class="w-full px-3.5 py-2.5 rounded-xl bg-obsidian-950 border border-zinc-700 text-xs text-white" />
                </div>

                <div>
                  <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Sinopsis / Descripción</label>
                  <textarea id="adm-desc" rows="2" placeholder="Breve resumen..." class="w-full px-3.5 py-2 rounded-xl bg-obsidian-950 border border-zinc-700 text-xs text-white">${editing ? escapeHtml(editing.description) : ''}</textarea>
                </div>

                ${!isEpisodic ? `
                  <div class="p-3.5 rounded-2xl bg-obsidian-950 border border-zinc-800 space-y-3">
                    <div>
                      <label class="block text-[11px] font-bold text-amber-400 uppercase mb-1">
                        Enlace de Reproducción (YouTube, Facebook, Drive, Dropbox, MP4 o .M3U8) *
                      </label>
                      <input id="adm-url" type="url" required value="${editing ? escapeHtml(editing.url || '') : ''}" placeholder="https://..." class="w-full px-3.5 py-2.5 rounded-xl bg-obsidian-900 border border-zinc-700 text-xs text-white" />
                    </div>
                    <div>
                      <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Plataforma / Formato</label>
                      <select id="adm-source" class="w-full px-3.5 py-2.5 rounded-xl bg-obsidian-900 border border-zinc-700 text-xs text-white">
                        <option value="auto">Detección Automática</option>
                        <option value="youtube" ${editing && editing.sourceType === 'youtube' ? 'selected' : ''}>YouTube</option>
                        <option value="facebook" ${editing && editing.sourceType === 'facebook' ? 'selected' : ''}>Facebook Video</option>
                        <option value="drive" ${editing && editing.sourceType === 'drive' ? 'selected' : ''}>Google Drive</option>
                        <option value="dropbox" ${editing && editing.sourceType === 'dropbox' ? 'selected' : ''}>Dropbox</option>
                        <option value="m3u8" ${editing && editing.sourceType === 'm3u8' ? 'selected' : ''}>TV en Vivo (.M3U8)</option>
                        <option value="mp4" ${editing && editing.sourceType === 'mp4' ? 'selected' : ''}>Directo MP4</option>
                      </select>
                    </div>
                  </div>
                ` : `
                  <div class="p-3.5 rounded-2xl bg-obsidian-950 border border-zinc-800 space-y-3">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-black text-amber-400">Temporadas y Episodios</span>
                      <button type="button" onclick="addAdminSeason()" class="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-400 text-[11px] font-bold cursor-pointer">
                        + Temporada
                      </button>
                    </div>

                    <div class="space-y-3 max-h-72 overflow-y-auto pr-1">
                      ${state.adminSeasonsDraft.map((season, sIdx) => `
                        <div class="p-3 rounded-xl bg-obsidian-900 border border-zinc-800 space-y-2">
                          <div class="flex items-center justify-between">
                            <span class="text-xs font-extrabold text-white">Temporada ${season.seasonNumber}</span>
                            <div class="flex items-center gap-2">
                              <button type="button" onclick="addAdminEpisode(${sIdx})" class="text-[11px] font-bold text-emerald-400 cursor-pointer">+ Episodio</button>
                              ${state.adminSeasonsDraft.length > 1 ? `<button type="button" onclick="removeAdminSeason(${sIdx})" class="text-[11px] text-rose-400 cursor-pointer">✕</button>` : ''}
                            </div>
                          </div>

                          ${season.episodes.map((ep, eIdx) => `
                            <div class="grid grid-cols-12 gap-1.5 items-center bg-obsidian-950 p-2 rounded-lg">
                              <input
                                type="text"
                                value="${escapeHtml(ep.title)}"
                                oninput="updateDraftEpisode(${sIdx}, ${eIdx}, 'title', this.value)"
                                placeholder="Título Ep. ${ep.number}"
                                class="col-span-5 px-2 py-1.5 rounded bg-obsidian-900 border border-zinc-800 text-[11px] text-white"
                              />
                              <input
                                type="url"
                                value="${escapeHtml(ep.url)}"
                                oninput="updateDraftEpisode(${sIdx}, ${eIdx}, 'url', this.value)"
                                placeholder="Link video..."
                                class="col-span-6 px-2 py-1.5 rounded bg-obsidian-900 border border-zinc-800 text-[11px] text-white"
                              />
                              <button type="button" onclick="removeAdminEpisode(${sIdx}, ${eIdx})" class="col-span-1 text-center text-rose-400 text-xs font-bold cursor-pointer">✕</button>
                            </div>
                          `).join('')}
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `}

                <!-- Programación Próximamente y Destacado -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                  <div>
                    <label class="block text-[11px] font-bold text-indigo-400 uppercase mb-1">Estreno Programado (Opcional)</label>
                    <input
                      id="adm-release"
                      type="datetime-local"
                      value="${editing && editing.releaseAt ? escapeHtml(editing.releaseAt) : ''}"
                      class="w-full px-3 py-2 rounded-xl bg-obsidian-950 border border-zinc-700 text-xs text-white"
                    />
                  </div>
                  <label class="flex items-center gap-2.5 p-3 rounded-xl bg-obsidian-950 border border-zinc-800 cursor-pointer self-end">
                    <input id="adm-featured" type="checkbox" ${editing && editing.featured ? 'checked' : ''} class="w-4 h-4 accent-amber-500" />
                    <span class="text-xs font-bold text-zinc-200">Mostrar en Destacados</span>
                  </label>
                </div>

                <button
                  type="submit"
                  class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-black text-xs sm:text-sm shadow-lg shadow-amber-500/20 transition cursor-pointer"
                >
                  ${editing ? 'Guardar Cambios' : 'Publicar en Catálogo'}
                </button>
              </form>

              <!-- Listado del Catálogo en Admin -->
              <div class="lg:col-span-7 bg-obsidian-900 border border-zinc-800 rounded-3xl p-6">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
                  <div>
                    <h2 class="text-lg font-black text-white">Catálogo Publicado (${filteredCatalog.length})</h2>
                    <p class="text-xs text-zinc-400">Administra, edita o elimina elementos existentes.</p>
                  </div>

                  <div class="flex items-center gap-2">
                    <input
                      type="text"
                      value="${escapeHtml(state.adminSearch)}"
                      oninput="state.adminSearch=this.value; renderApp();"
                      placeholder="Filtrar por título..."
                      class="px-3 py-2 rounded-xl bg-obsidian-950 border border-zinc-700 text-xs text-white"
                    />
                    <select
                      onchange="state.adminFilterType=this.value; renderApp();"
                      class="px-3 py-2 rounded-xl bg-obsidian-950 border border-zinc-700 text-xs text-white"
                    >
                      <option value="all" ${state.adminFilterType === 'all' ? 'selected' : ''}>Todos</option>
                      <option value="movie" ${state.adminFilterType === 'movie' ? 'selected' : ''}>Películas</option>
                      <option value="series" ${state.adminFilterType === 'series' ? 'selected' : ''}>Series</option>
                      <option value="anime" ${state.adminFilterType === 'anime' ? 'selected' : ''}>Anime</option>
                      <option value="live" ${state.adminFilterType === 'live' ? 'selected' : ''}>TV en Vivo</option>
                    </select>
                  </div>
                </div>

                <div class="space-y-2.5 max-h-[680px] overflow-y-auto pr-1">
                  ${filteredCatalog.map(item => {
                    const badge = getSourceBadge(item.sourceType || 'mp4');
                    const upcoming = isItemUpcoming(item);
                    const typeNames = { movie: 'Película', series: 'Serie', anime: 'Anime', live: 'TV en Vivo' };
                    return `
                      <div class="flex items-center justify-between gap-3 p-3 rounded-2xl bg-obsidian-950 border border-zinc-800/90 hover:border-zinc-700 transition">
                        <div class="flex items-center gap-3 min-w-0">
                          <img
                            src="${escapeHtml(item.poster || 'https://placehold.co/120x180/14141b/f59e0b?text=TV')}"
                            onerror="this.src='https://placehold.co/120x180/14141b/f59e0b?text=TV'"
                            class="w-11 h-16 rounded-lg object-cover bg-obsidian-900 shrink-0"
                          />
                          <div class="min-w-0">
                            <div class="flex flex-wrap items-center gap-1.5 mb-1">
                              <span class="px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 text-[10px] font-bold">${typeNames[item.type] || item.type}</span>
                              ${!isEpisodicType(item.type) ? `<span class="px-2 py-0.5 rounded border text-[10px] font-bold ${badge.cls}">${badge.label}</span>` : ''}
                              ${item.featured ? `<span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 text-[10px] font-bold">★ Destacado</span>` : ''}
                              ${upcoming ? `<span class="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 text-[10px] font-bold">🕒 ${escapeHtml(formatReleaseDateTime(item.releaseAt))}</span>` : ''}
                            </div>
                            <h3 class="text-xs sm:text-sm font-extrabold text-white truncate">${escapeHtml(item.title)}</h3>
                            <p class="text-[11px] text-zinc-500 truncate">${escapeHtml(item.category || '')} • ${escapeHtml(item.year || '')}</p>
                          </div>
                        </div>

                        <div class="flex items-center gap-1.5 shrink-0">
                          <button
                            onclick="playMedia('${item.id}')"
                            title="Probar reproducción"
                            class="px-2.5 py-1.5 rounded-lg bg-emerald-500/15 hover:bg-emerald-500 text-emerald-400 hover:text-black text-xs font-bold transition cursor-pointer"
                          >
                            ▶
                          </button>
                          <button
                            onclick="editAdminItem('${item.id}')"
                            class="px-3 py-1.5 rounded-lg bg-obsidian-850 hover:bg-amber-500 text-zinc-200 hover:text-black text-xs font-bold transition cursor-pointer"
                          >
                            Editar
                          </button>
                          <button
                            onclick="deleteAdminItem('${item.id}')"
                            class="px-2.5 py-1.5 rounded-lg bg-rose-500/15 hover:bg-rose-500 text-rose-400 hover:text-white text-xs font-bold transition cursor-pointer"
                          >
                            ✕
                          </button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          </main>

          ${renderPlayerOverlay()}
        </div>
      `;
    }

    // =========================================================================
    // 10. RENDERIZADO PRINCIPAL E INICIALIZACIÓN
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      if (state.isAdminRoute) {
        root.innerHTML = renderAdminPanel();
        initMediaPlayerRuntime();
        return;
      }

      if (!state.activeProfileId || !getActiveProfile()) {
        root.innerHTML = renderProfileGate();
        return;
      }

      const showHome = state.activeTab === 'home' && !state.searchQuery.trim();

      root.innerHTML = `
        ${renderNavbar()}
        <main class="flex-1 flex flex-col">
          ${showHome ? renderHomeView() : renderCatalogView()}
        </main>
        <footer class="border-t border-zinc-900 py-6 px-4 sm:px-8 text-center text-xs text-zinc-500">
          AUREA STREAM • Películas, Series, Anime y TV en Vivo
        </footer>
        ${renderDetailModal()}
        ${renderPlayerOverlay()}
      `;

      initMediaPlayerRuntime();
    }

    window.addEventListener('hashchange', () => {
      checkAdminRoute();
      renderApp();
    });

    window.addEventListener('popstate', () => {
      checkAdminRoute();
      renderApp();
    });

    window.onload = async function () {
      checkAdminRoute();
      await loadInitialData();
      startBackgroundTimers();
      renderApp();
    };
  </script>
</body>
</html>
